name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # "build" is the status check required on main. Renaming this job breaks that rule.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Generates the global LayoutProps/PageProps types that tsc needs on a fresh checkout.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
